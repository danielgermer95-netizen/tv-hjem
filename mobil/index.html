<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1020">
<title>TV Hjem</title>
<style>
  :root { --bg:#0b1020; --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.12); --txt:#fff; --mut:rgba(255,255,255,.6); --acc:#7c8cff; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { background: radial-gradient(120% 60% at 50% 0%, #2a2f6b 0%, var(--bg) 60%); display:flex; flex-direction:column;
         padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px); overscroll-behavior:none; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  h1 { font-size:22px; font-weight:700; }
  .pill { font-size:12px; padding:5px 10px; border-radius:99px; background:rgba(60,220,130,.15); color:#6ff0a8; }
  .tabs { display:flex; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:4px; margin-bottom:14px; }
  .tabs button { flex:1; padding:10px 0; border:0; border-radius:10px; background:none; color:var(--mut); font-weight:600; font-size:15px; font-family:inherit; }
  .tabs button.on { background:rgba(255,255,255,.14); color:#fff; }
  .panel { display:none; flex:1; flex-direction:column; min-height:0; }
  .panel.on { display:flex; }
  .canvaswrap { flex:1; min-height:0; border-radius:22px; overflow:hidden; border:1px solid var(--line);
                background: linear-gradient(160deg,#3b2a6e,#1b2550 60%,#0f1736); position:relative; touch-action:none; }
  canvas { width:100%; height:100%; display:block; touch-action:none; }
  .hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--mut); font-size:15px; pointer-events:none; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; }
  .colors { display:flex; gap:8px; flex-wrap:wrap; }
  .sw { width:30px; height:30px; border-radius:50%; border:2px solid transparent; }
  .sw.on { border-color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,.25); }
  .tools { display:flex; gap:6px; }
  .tool { width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:#fff; font-size:16px; display:flex; align-items:center; justify-content:center; }
  .tool.on { background:rgba(255,255,255,.18); }
  .dot { border-radius:50%; background:#fff; }
  .send { margin-top:12px; width:100%; padding:16px; border:0; border-radius:16px; font-weight:700; font-size:17px; font-family:inherit;
          background:linear-gradient(135deg,#8b7cff,#5b8cff); color:#fff; box-shadow:0 10px 30px rgba(91,140,255,.35); }
  .send:active { transform:scale(.98); }
  textarea { flex:1; min-height:160px; width:100%; border-radius:22px; border:1px solid var(--line); background:var(--card); color:#fff;
             font-weight:600; font-size:24px; font-family:inherit; padding:18px; resize:none; outline:none; }
  .quick { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .quick button { padding:9px 14px; border-radius:99px; border:1px solid var(--line); background:var(--card); color:#fff; font-weight:500; font-size:15px; font-family:inherit; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .app { aspect-ratio:1; border-radius:22px; border:0; color:#fff; font-weight:800; font-size:17px; font-family:inherit; display:flex; align-items:center; justify-content:center; text-align:center; padding:6px; }
  .app:active { transform:scale(.95); }
  .ghost { margin-top:14px; width:100%; padding:14px; border-radius:16px; border:1px solid var(--line); background:var(--card); color:#fff; font-weight:600; font-size:15px; font-family:inherit; }
  #toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 90px); transform:translateX(-50%) translateY(20px); opacity:0;
           background:rgba(20,24,40,.92); border:1px solid var(--line); padding:12px 18px; border-radius:14px; font-size:15px; transition:.25s; pointer-events:none; white-space:nowrap; }
  #toast.on { opacity:1; transform:translateX(-50%); }
</style>
</head>
<body>
  <header><h1>TV Hjem</h1><span class="pill" id="status">● Klar</span></header>

  <div class="tabs">
    <button data-tab="tegn" class="on">Tegn</button>
    <button data-tab="skriv">Skriv</button>
    <button data-tab="apps">Apps</button>
  </div>

  <section class="panel on" id="tegn">
    <div class="canvaswrap"><canvas id="cv"></canvas><div class="hint" id="hint">Tegn en lille besked til TV'et ✍️</div></div>
    <div class="row">
      <div class="colors" id="colors"></div>
      <div class="tools">
        <button class="tool" id="size" aria-label="Pensel"><span class="dot" style="width:8px;height:8px"></span></button>
        <button class="tool" id="undo" aria-label="Fortryd">↶</button>
        <button class="tool" id="clear" aria-label="Ryd">✕</button>
      </div>
    </div>
    <button class="send" id="sendDraw">Send til TV</button>
  </section>

  <section class="panel" id="skriv">
    <textarea id="txt" maxlength="140" placeholder="Skriv en besked…"></textarea>
    <div class="quick" id="quick"></div>
    <button class="send" id="sendTxt">Send til TV</button>
  </section>

  <section class="panel" id="apps">
    <div class="grid" id="grid"></div>
    <button class="ghost" id="clearNote">Fjern besked fra TV'et</button>
  </section>

  <div id="toast"></div>

<script>
// Kanal-nøglen står IKKE i koden (siden er offentlig). Den gives med i linket:
//   https://.../#k=<kanal>   – gemmes derefter på telefonen.
var KANAL = (function () {
  var m = location.hash.match(/k=([\w-]+)/), k = null;
  try { if (m) localStorage.setItem("kanal", m[1]); k = localStorage.getItem("kanal"); } catch (e) { k = m && m[1]; }
  if (m) history.replaceState(null, "", location.pathname);
  while (!k) { k = (prompt("Indtast kanal-nøgle (står i tv-app/config.js):") || "").trim(); try { localStorage.setItem("kanal", k); } catch (e) {} }
  return k;
})();
var NTFY = "https://ntfy.sh/" + encodeURIComponent(KANAL);

var $ = function (s) { return document.querySelector(s); };
function toast(m) { var t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove("on"); }, 2200); }
function status(ok, m) { var s = $("#status"); s.textContent = "● " + m; s.style.color = ok ? "#6ff0a8" : "#ff8a8a"; s.style.background = ok ? "rgba(60,220,130,.15)" : "rgba(255,90,90,.15)"; }
function post(body, headers) {
  status(true, "Sender…");
  return fetch(NTFY, { method: "POST", body: body, headers: headers || {} })
    .then(function (r) { if (!r.ok) throw new Error(r.status); status(true, "Sendt"); return r; })
    .catch(function (e) { status(false, "Fejl"); toast("Kunne ikke sende (" + e.message + ")"); throw e; });
}

// Faner
document.querySelectorAll(".tabs button").forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll(".tabs button").forEach(function (x) { x.classList.toggle("on", x === b); });
    document.querySelectorAll(".panel").forEach(function (p) { p.classList.toggle("on", p.id === b.dataset.tab); });
    if (b.dataset.tab === "tegn") resize();
  };
});

// ---------- Tegning ----------
var cv = $("#cv"), ctx = cv.getContext("2d"), strokes = [], cur = null;
var COLORS = ["#ffffff", "#ffd25a", "#ff9a3c", "#ff4d8d", "#b07cff", "#5b9dff", "#3ddc97", "#ff5a5a"];
var SIZES = [4, 8, 14], color = COLORS[0], size = 1;
COLORS.forEach(function (c, i) {
  var b = document.createElement("button"); b.className = "sw" + (i ? "" : " on"); b.style.background = c;
  b.onclick = function () { color = c; document.querySelectorAll(".sw").forEach(function (x) { x.classList.toggle("on", x === b); }); };
  $("#colors").appendChild(b);
});
$("#size").onclick = function () { size = (size + 1) % 3; var d = this.firstChild, px = [5, 9, 14][size] + "px"; d.style.width = d.style.height = px; };
$("#undo").onclick = function () { strokes.pop(); redraw(); };
$("#clear").onclick = function () { strokes = []; redraw(); };

function resize() {
  var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); redraw();
}
function drawStroke(c, s, scale) {
  c.strokeStyle = s.color; c.lineWidth = s.w * scale; c.lineCap = c.lineJoin = "round";
  c.beginPath();
  var p = s.pts;
  c.moveTo(p[0][0] * scale, p[0][1] * scale);
  if (p.length === 1) c.lineTo(p[0][0] * scale + .1, p[0][1] * scale);
  for (var i = 1; i < p.length - 1; i++) {
    var mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2;
    c.quadraticCurveTo(p[i][0] * scale, p[i][1] * scale, mx * scale, my * scale);
  }
  if (p.length > 1) c.lineTo(p[p.length - 1][0] * scale, p[p.length - 1][1] * scale);
  c.stroke();
}
function redraw() {
  var r = cv.getBoundingClientRect(); ctx.clearRect(0, 0, r.width, r.height);
  strokes.forEach(function (s) { drawStroke(ctx, s, 1); });
  $("#hint").style.display = strokes.length ? "none" : "flex";
}
function pt(e) { var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener("pointerdown", function (e) { cv.setPointerCapture(e.pointerId); cur = { color: color, w: SIZES[size], pts: [pt(e)] }; strokes.push(cur); redraw(); });
cv.addEventListener("pointermove", function (e) { if (!cur) return; cur.pts.push(pt(e)); redraw(); });
["pointerup", "pointercancel"].forEach(function (ev) { cv.addEventListener(ev, function () { cur = null; }); });
window.addEventListener("resize", resize); resize();

$("#sendDraw").onclick = function () {
  if (!strokes.length) return toast("Tegn noget først ✍️");
  // Beskær til tegningen og eksportér med gennemsigtig baggrund
  var minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  strokes.forEach(function (s) { s.pts.forEach(function (p) { minx = Math.min(minx, p[0] - s.w); miny = Math.min(miny, p[1] - s.w); maxx = Math.max(maxx, p[0] + s.w); maxy = Math.max(maxy, p[1] + s.w); }); });
  var pad = 16, sc = 2, w = maxx - minx + pad * 2, h = maxy - miny + pad * 2;
  var out = document.createElement("canvas"); out.width = w * sc; out.height = h * sc;
  var o = out.getContext("2d"); o.translate((pad - minx) * sc, (pad - miny) * sc);
  strokes.forEach(function (s) { drawStroke(o, s, sc); });
  out.toBlob(function (blob) {
    post(blob, { "Filename": "note.png", "Title": "note" }).then(function () { toast("Sendt til TV'et 💌"); strokes = []; redraw(); });
  }, "image/png");
};

// ---------- Tekst ----------
["Aftensmaden er klar 🍝", "Elsker dig ❤️", "Film i aften? 🍿", "Husk at tømme opvaskeren", "Godnat 🌙"].forEach(function (q) {
  var b = document.createElement("button"); b.textContent = q; b.onclick = function () { $("#txt").value = q; }; $("#quick").appendChild(b);
});
$("#sendTxt").onclick = function () {
  var t = $("#txt").value.trim(); if (!t) return toast("Skriv noget først");
  post(t).then(function () { toast("Sendt til TV'et 💬"); $("#txt").value = ""; });
};

// ---------- Apps ----------
var APPS = [
  ["drtv", "DR TV", "#111"], ["tv2play", "TV 2 Play", "linear-gradient(135deg,#ff3a3a,#b5001b)"], ["netflix", "Netflix", "#000"],
  ["hbomax", "HBO Max", "linear-gradient(135deg,#002be7,#5b1bd6)"], ["prime", "Prime Video", "linear-gradient(135deg,#1a98ff,#0f5ec7)"],
  ["disney", "Disney+", "linear-gradient(135deg,#0b1b5c,#0e5b7a)"], ["viaplay", "Viaplay", "linear-gradient(135deg,#2b0d4d,#7a1fbf)"],
  ["skyshow", "SkyShowtime", "linear-gradient(135deg,#0f0f18,#3a2a6b)"], ["appletv", "Apple TV", "linear-gradient(160deg,#2a2a2e,#000)"],
  ["youtube", "YouTube", "#e00"], ["spotify", "Spotify", "#1db954"], ["playstation", "PlayStation", "linear-gradient(135deg,#0070d1,#003087)"]
];
APPS.forEach(function (a) {
  var b = document.createElement("button"); b.className = "app"; b.textContent = a[1]; b.style.background = a[2];
  if (a[0] === "netflix") b.style.color = "#e50914";
  b.onclick = function () { post("launch:" + a[0], { "Title": "cmd" }).then(function () { toast("Åbner " + a[1] + " på TV'et"); }); };
  $("#grid").appendChild(b);
});
$("#clearNote").onclick = function () { post("clear", { "Title": "cmd" }).then(function () { toast("Beskeden er fjernet"); }); };
</script>
</body>
</html>
