<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Hjem</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="sky"></div>
    <div id="stars"></div>
    <div id="precip"></div>
    <svg id="hills" viewBox="0 0 1920 380" preserveAspectRatio="none" aria-hidden="true">
      <path class="h1" d="M0 230 C 220 150 380 190 560 140 S 900 60 1120 130 S 1500 90 1700 150 S 1920 140 1920 140 V380 H0Z"/>
      <path class="h2" d="M0 290 C 260 230 480 270 700 230 S 1100 190 1340 240 S 1720 220 1920 250 V380 H0Z"/>
      <path class="h3" d="M0 340 C 300 310 620 330 960 315 S 1600 300 1920 320 V380 H0Z"/>
    </svg>

    <header id="top">
      <div id="clockwrap">
        <div id="date"></div>
        <div id="clock">--:--</div>
      </div>
    </header>

    <section id="weather" class="glass">
      <div id="now">
        <div class="now-place"><span id="city"></span><span id="updated"></span></div>
        <div class="now-main">
          <div id="now-icon"></div>
          <div id="now-temp">--°</div>
        </div>
        <div id="now-desc"></div>
        <div id="now-stats"></div>
      </div>
      <div id="right">
        <div id="hourly"></div>
        <div id="daily"></div>
      </div>
    </section>

    <section id="notes" class="glass">
      <div class="notes-head">Beskeder</div>
      <div id="note-body">
        <div id="note-empty">Ingen beskeder<br>Tegn eller skriv en fra mobilen ✍️</div>
        <img id="note-img" src="" alt="">
        <div id="note-text"></div>
      </div>
      <div id="note-meta"></div>
    </section>

    <nav id="dock"></nav>
    <div id="toast" class="hidden"></div>
  </div>

  <script src="config.js"></script>
  <script>
    /* Henter altid den nyeste udgave fra GitHub, så appen opdaterer sig selv.
       Er der ingen forbindelse, bruges kopien, der er installeret på TV'et. */
    (function () {
      var BASE = "https://danielgermer95-netizen.github.io/tv-hjem/tv-app/";
      var local = location.protocol !== "https:" || location.href.indexOf(BASE) !== 0;
      var done = false, v = "?v=" + Math.floor(Date.now() / 600000);
      function load(src) { var s = document.createElement("script"); s.src = src; document.body.appendChild(s); return s; }
      function fallback() { if (!done) { done = true; load("app.js"); } }
      if (!local) { done = true; load("app.js"); }
      else {
        var l = document.createElement("link"); l.rel = "stylesheet"; l.href = BASE + "style.css" + v; document.head.appendChild(l);
        var r = load(BASE + "app.js" + v);
        r.onload = function () { done = true; };
        r.onerror = fallback;
        setTimeout(fallback, 8000);
      }
      // Genindlæs når appen har ligget i baggrunden i mere end 6 timer, så nye ændringer kommer med
      var started = Date.now();
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && Date.now() - started > 6 * 3600 * 1000) location.reload();
      });
    })();
  </script>
</body>
</html>
